[project]
name = "k8s-remediation-agent"
version = "0.1.0"
description = "Guardrailed Kubernetes remediation agent with LLM-assisted diagnosis"
requires-python = ">=3.11"
dependencies = [
    "kubernetes>=30.0.0",
    "anthropic>=0.34.0",
    "pydantic>=2.8.0",
    "pyyaml>=6.0.0",
    "structlog>=24.0.0",
    "python-json-logger>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "mypy>=1.11.0",
    "ruff>=0.5.0",
]

[build-system]
requires = ["setuptools>=68.0.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "PT"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
